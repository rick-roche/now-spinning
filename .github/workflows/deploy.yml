name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    concurrency:
      group: coolify-production
      cancel-in-progress: false

    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          read -r current_sha _ < <(git ls-remote "https://github.com/${REPOSITORY}.git" refs/heads/main)
          if ! bash .github/scripts/validated-commit-is-current.sh "${VALIDATED_SHA}" "${current_sha}"; then
            echo "Deployment skipped because main moved after CI completed."
            exit 0
          fi
          echo "Validated deployment SHA: ${VALIDATED_SHA}" >> "$GITHUB_STEP_SUMMARY"
          curl --fail-with-body --retry 3 --request POST --header "Authorization: Bearer ${COOLIFY_TOKEN}" "${COOLIFY_WEBHOOK}"
