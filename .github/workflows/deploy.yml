name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    concurrency:
      group: coolify-production
      cancel-in-progress: false

    steps:
      - name: Deploy the validated image
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_APPLICATION_UUID: ${{ secrets.COOLIFY_APPLICATION_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          VALIDATED_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          api_url="${COOLIFY_API_URL%/}/api/v1"
          auth_header="Authorization: Bearer ${COOLIFY_TOKEN}"
          application_url="${api_url}/applications/${COOLIFY_APPLICATION_UUID}"
          deploy_url="${api_url}/deploy?uuid=${COOLIFY_APPLICATION_UUID}"

          curl --fail-with-body --retry 3 --request PATCH \
            --header "${auth_header}" \
            --header 'Content-Type: application/json' \
            --data "{\"docker_registry_image_tag\":\"${VALIDATED_TAG}\"}" \
            "${application_url}"
          curl --fail-with-body --retry 3 --request POST \
            --header "${auth_header}" \
            "${deploy_url}"
          echo "Validated deployment SHA: ${VALIDATED_TAG}" >> "$GITHUB_STEP_SUMMARY"
