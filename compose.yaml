services:
  app:
    # Local/provider-portable tooling. Coolify production uses an Application
    # built directly from the root Dockerfile, not this Compose file.
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /data/now-spinning.sqlite
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:?PUBLIC_APP_ORIGIN is required}
      LASTFM_CALLBACK_URL: ${LASTFM_CALLBACK_URL:?LASTFM_CALLBACK_URL is required}
      DISCOGS_CALLBACK_URL: ${DISCOGS_CALLBACK_URL:?DISCOGS_CALLBACK_URL is required}
      LASTFM_API_KEY: ${LASTFM_API_KEY:?LASTFM_API_KEY is required}
      LASTFM_API_SECRET: ${LASTFM_API_SECRET:?LASTFM_API_SECRET is required}
      DISCOGS_CONSUMER_KEY: ${DISCOGS_CONSUMER_KEY:?DISCOGS_CONSUMER_KEY is required}
      DISCOGS_CONSUMER_SECRET: ${DISCOGS_CONSUMER_SECRET:?DISCOGS_CONSUMER_SECRET is required}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY is required}
      DEV_MODE: ${DEV_MODE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - now-spinning-data:/data
    expose:
      - "3000"

volumes:
  now-spinning-data:
